[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spinpy"
version = "0.0.1"
description = "Python reimplementation of the Spinach spin dynamics kernel"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py>=3.10"]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["plotly>=6"]
compare = ["spinpy[plot]", "matplotlib>=3.8"]
docs = ["spinpy[plot]", "jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spinpy = ["grids/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
